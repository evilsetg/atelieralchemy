; Atelier Alchemy settings. Changes take effect after restarting the game.

[General]
; DirectInput scan code of the key that opens the synthesis menu (default 0x25 = K).
; See https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes
HotkeyKeyboard = 0x25
; Gamepad button that opens the menu, 0 = disabled.
; 0x0010 Start, 0x0020 Back, 0x0040 L3, 0x0080 R3, 0x0100 LB, 0x0200 RB, 0x4000 X, 0x8000 Y
HotkeyGamepad = 0
; Require an alchemy lab nearby (or being seated at one). Set to false to brew anywhere.
RequireAlchemyLab = true
LabSearchRadius = 450
; Show a "[K] Atelier Synthesis" hint while using a vanilla alchemy lab.
ShowCraftingHint = true

[Ring]
; Also switchable in the synthesis window (next to the Synthesize button), which saves it here.
; Normal - the full Judgement Ring
; Easy   - slower needle, wider areas, a miss doesn't end the ring
; Auto   - every area is hit automatically (no hit or strike bonus, no perfect)
Mode = Normal
SpeedMultiplier = 1.0
WidthMultiplier = 1.0
; Shadow Hearts rule: missing an area fails all remaining areas.
MissEndsRing = true

[Sound]
; Judgement Ring cues (start, hit, strike, miss, perfect). The WAV files live in
; SKSE/Plugins/AtelierAlchemy/sounds and can be replaced with any 16-bit PCM WAV.
Enabled = true
; 0.0 - 1.0, multiplied with the game's master volume.
Volume = 0.8

[Balance]
; Multiplies every effect magnitude of synthesized items.
MagnitudeMultiplier = 1.0
XPMultiplier = 1.0
; How many traits a product can inherit before effect-line bonuses (0-5).
BaseTraitSlots = 3
; Apply your alchemy perks and Fortify Alchemy the way the vanilla alchemy lab does. Every
; perk with a "Mod Alchemy Effectiveness" entry counts, so perk overhauls such as Ordinator
; work without a patch.
UsePerks = true
IngredientQualityMultiplier = 1.0
; Chance (0-1) that a gathered ingredient carries a trait.
TraitChance = 0.35

[UI]
; Bundled Alegreya Sans (SIL Open Font License). Any .ttf works, e.g. C:\Windows\Fonts\segoeui.ttf
FontPath = Data/SKSE/Plugins/AtelierAlchemy/fonts/AlegreyaSans-Regular.ttf
; 0 = scale with resolution
FontSize = 0
Scale = 1.0
